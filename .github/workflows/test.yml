name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check userscript
        run: node --check force-codec-in-yt-and-yt-music.user.js
      - name: Run core unit tests
        run: node tests/core.test.mjs
      - name: Run runtime smoke tests
        run: node tests/runtime.smoke.test.mjs
